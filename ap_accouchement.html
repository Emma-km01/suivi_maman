<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Après Accouchement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header-shared"></header>
    <main>
        <div class="hero-post">
            <h1>Après accouchement</h1>
            <p>Prenez soins de vous et de votre bébé.</p>
            <img src="maman_bebe_post.png" alt="">
        </div>
        <div class="grid-container">
            <div class="card-action pink-light">
                <h3>Soins du bébé</h3>
                <button class="btn-pink" onclick="goTo('conseil.html')">Voir</button>
            </div>
            <div class="card-action blue-light">
                <h3>Récupération maman</h3>
                <button class="btn-blue">Voir</button>
            </div>
            <div class="card-action gray-light">
                <h3>Conseils pratiques</h3>
                <button class="btn-gray">Voir</button>
            </div>
        </div>
        <div class="daily-tips">
            <h3>Conseils du jour</h3>
            <ul>
                <li>Se reposer dès que bébé dort.</li>
                <li>Bien s'hydrater et manger équilibré.</li>
            </ul>
        </div>
    </main>
    <footer id="footer-shared"></footer>
    <script src="script.js"></script>
</body>
</html>
