<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Suivi Maman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><img src="./images_suivi/logo.png" alt=""></div>
        <nav>
            <a href="accueil.html">Accueil</a>
            <a href="rdv.html">Rendez-vous</a>
            <a href="grossesse.html">Grossesse</a>
            <a href="ap_accouchement.html">Après accouchement</a>
        </nav>
    </header>
    <main>
        <h1 class="main-title">Suivez votre grossesse et votre post-partum en toute sérénité</h1>
        <div class="blue-section">
            <p>Inscrivez-vous</p>
            <form id="formInscr">
                <input type="text" placeholder="Nom">
                <input type="text" placeholder="Prénoms">
                <input type="text" placeholder="Émail/téléphone">
                <input type="password" placeholder="Créer un mot de passe">
            </form>
        </div>
        <div class="center"><button class="btn-pink" onclick="goTo('connexion.html')">Inscription</button></div>
    </main>

    <section>
        <div class="connex">
            <p>Vous avez déjà un compte ?</p>
            <div class="connet" onclick="goTo('connexion.html')"><p>Connectez-vous</p></div>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
